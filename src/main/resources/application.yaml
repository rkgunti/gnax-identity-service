spring:
  application:
    name: gnax-identity-service

  config:
    # for local development, you can use the config server running on localhost
    import: "configserver:http://localhost:30888"
    # for production, you can use the config server running on the Kubernetes cluster
    # import: "configserver:http://gnax-config-server:8888"

  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}

gnax:
  jwt:
    issuer: gnax-identity-service
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # PEM contents; supply via config server / env in real environments.
    # If blank, an ephemeral key pair is generated (dev only).
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
